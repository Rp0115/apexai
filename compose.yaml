services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: apex-db
    environment:
      POSTGRES_DB: apexai
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: f1password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d apexai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
