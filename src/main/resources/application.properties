spring.application.name=apexai

# Virtual threads (Java 25)
spring.threads.virtual.enabled=true

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/apexai}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:f1password}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Docker Compose (local only — disabled inside containers)
spring.docker.compose.enabled=${DOCKER_COMPOSE_ENABLED:true}
spring.docker.compose.lifecycle-management=start-only

# OpenF1 – 2023 Japan GP Race
apexai.openf1.base-url=https://api.openf1.org/v1
apexai.openf1.session-key=9173
apexai.openf1.meeting-key=1220
apexai.openf1.session-type=Race

# Hybrid default: no remote GenAI / vector store (enable via profile `ai`)
apexai.ai.enabled=false
spring.ai.model.chat=none
spring.ai.model.embedding.text=none
spring.ai.vectorstore.type=none
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=gemini-2.0-flash

# pgvector defaults (used when profile `ai` sets type=pgvector)
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768

# Batch
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# Actuator / observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=apexai
management.info.env.enabled=true
info.app.name=ApexAI Virtual Race Engineer
info.app.version=0.0.1-SNAPSHOT

# Gateway rate limit (requests per minute per IP)
apexai.gateway.rate-limit-per-minute=60

# Server
server.port=${PORT:8080}
server.error.include-message=always
